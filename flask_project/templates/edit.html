{%- extends "base.html" -%} {%- block title -%}Edit Note{%- endblock -%} {%-
block content -%}
<h2>Edit Note</h2>
<form method="POST" action="{{ url_for('note_detail', id=note.id) }}">
  <label for="title">Title:</label><br />
  <input
    type="text"
    id="title"
    name="title"
    value="{{ note.title }}"
    required
  /><br /><br />
  <label for="content">Content:</label><br />
  <textarea id="content" name="content">{{ note.content }}</textarea
  ><br /><br />
  <input type="submit" value="Update Note" />
</form>
<br />
<a href="{{ url_for('index') }}">Back to Home</a>
{%- endblock -%}
